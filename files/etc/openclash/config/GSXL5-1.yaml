  - DOMAIN-SUFFIX,pc528.net,DIRECT
  - DOMAIN-SUFFIX,045400.xyz,DIRECT
  - DOMAIN,api.cloudflare.com,Telegram
  - DOMAIN-SUFFIX,oraclecloud.com,Telegram
  - DOMAIN-SUFFIX,cloudflare.com,Telegram
  - DOMAIN-SUFFIX,cloudflare.net,Telegram
  - DOMAIN-SUFFIX,cloudflareclient.com,Telegram
  - DOMAIN-SUFFIX,huamucang.top,Telegram
  - DOMAIN-SUFFIX,hdhive.com,国外
  - DOMAIN-SUFFIX,v2rayssr.com,AI

  # 5. 业务分流规则集
  - RULE-SET,Meta_AI_Domain,Meta_AI
  - RULE-SET,WhatsApp_Domain,Meta_AI
