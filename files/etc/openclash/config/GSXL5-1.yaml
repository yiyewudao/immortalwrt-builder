  - {name: 新加坡西-手选, icon: "https://gh-proxy.com/raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png", type: select, use: [一叶], filter: "(?=.*(SGx|sgx|新加坡.*西)).*$"}
