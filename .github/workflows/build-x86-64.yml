name: 构建 ImmortalWrt x86-64 固件

on:
  workflow_dispatch:
    inputs:
      immwrt_version:
        description: "ImmortalWrt 版本: 填 latest 自动用官方最新版; 也可指定如 25.12.2 / 25.12.1 / 25.12.0 (可选标签见 Docker Hub immortalwrt/imagebuilder 的 x86-64-openwrt-*)"
        required: false
        default: "latest"
        type: string
      firmware_size:
        description: "固件大小 (含 Docker 可用空间)"
        required: true
        default: "2G"
        type: choice
        options:
          - 1G
          - 2G
          - 3G
          - 4G
      lan_ip:
        description: "默认后台管理 IP"
        required: true
        default: "192.168.50.2"
      enable_nikki:
        description: "集成 Nikki (Mihomo 透明代理)"
        required: false
        default: true
        type: boolean
      enable_openclash:
        description: "集成 OpenClash"
        required: false
        default: true
        type: boolean
      enable_lucky:
        description: "集成 Lucky (动态域名/反代)"
        required: false
        default: true
        type: boolean
      enable_store:
        description: "集成 应用商店 (luci-app-store)"
        required: false
        default: true
        type: boolean
      enable_docker:
        description: "集成 Docker"
        required: false
        default: true
        type: boolean
      enable_passwall:
        description: "集成 PassWall"
        required: false
        default: true
        type: boolean
      enable_passwall2:
        description: "集成 PassWall2"
        required: false
        default: true
        type: boolean
      enable_quickfile:
        description: "集成 QuickFile (文件管理)"
        required: false
        default: true
        type: boolean
      enable_tgcheckin:
        description: "集成 TG 打卡依赖 (本人专用; 他人需要请去 tg-checkin 项目页学习: github.com/yiyewudao/tg-checkin)"
        required: false
        default: true
        type: boolean
      enable_runpkgs:
        description: "预置插件 .run 离线安装包到固件 /root/run (PassWall/PassWall2/OpenClash/Nikki, 刷机后可单独升级/重装, 无需重刷固件)"
        required: false
        default: true
        type: boolean
      extra_packages:
        description: "额外软件包 (空格分隔, 如: luci-i18n-samba4-zh-cn)"
        required: false
        default: ""

permissions:
  contents: write

# 防止手动构建和定时构建同时跑（排队，不取消）
concurrency:
  group: build-x86-64
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v5

      - name: 解析 ImmortalWrt 版本 (latest -> 官方最新版)
        id: ver
        run: |
          V="${{ inputs.immwrt_version }}"
          if [ -z "$V" ] || [ "$V" = "latest" ] || [ "$V" = "auto" ]; then
            echo "自动获取官方最新版本..."
            V=$(curl -s "https://hub.docker.com/v2/repositories/immortalwrt/imagebuilder/tags?page_size=100&name=x86-64-openwrt-" | python3 -c "
          import json, sys, re
          vers = []
          for t in json.load(sys.stdin).get('results', []):
              m = re.match(r'x86-64-openwrt-(\d+)\.(\d+)\.(\d+)\$', t['name'])
              if m:
                  vers.append(tuple(map(int, m.groups())))
          vers.sort()
          print(('%d.%d.%d' % vers[-1]) if vers else '')
          ")
            [ -z "$V" ] && { echo "❌ 获取最新版本失败"; exit 1; }
          fi
          echo "📌 使用版本: $V"
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: 生成首次开机配置 (后台IP/时区/主机名/Docker防火墙)
        run: |
          LAN_IP="${{ inputs.lan_ip }}" ENABLE_DOCKER="${{ inputs.enable_docker }}" \
            sh shell/gen-uci-defaults.sh

      # ================= 插件 .run 离线安装包 (sirpdboy/buildrun) =================
      # 与固件同期构建, 只取 fw4(nftables) + x86_64 + ipk 组合, 植入固件 /root/run
      - name: 生成 PassWall .run 离线包
        if: inputs.enable_runpkgs
        continue-on-error: true
        uses: sirpdboy/buildrun@passwall
        with:
          OUTPUT_DIR: "./pkgrun"

      - name: 生成 PassWall2 .run 离线包
        if: inputs.enable_runpkgs
        continue-on-error: true
        uses: sirpdboy/buildrun@passwall2
        with:
          OUTPUT_DIR: "./pkgrun"

      - name: 生成 OpenClash .run 离线包
        if: inputs.enable_runpkgs
        continue-on-error: true
        uses: sirpdboy/buildrun@openclash
        with:
          OUTPUT_DIR: "./pkgrun"

      - name: 生成 Nikki .run 离线包
        if: inputs.enable_runpkgs
        continue-on-error: true
        uses: sirpdboy/buildrun@nikki
        with:
          OUTPUT_DIR: "./pkgrun"

      - name: 筛选 .run 包并植入固件 files 目录
        if: inputs.enable_runpkgs
        run: |
          mkdir -p pkgrun files/root/run
          # 只保留与本固件匹配的包: fw4 (ImmortalWrt 22.03+ 均为 nftables) / x86_64 / ipk
          find pkgrun -maxdepth 1 -name '*-fw4-ipk-x86_64-*.run' -exec cp -v {} files/root/run/ \;
          if [ -z "$(ls files/root/run/*.run 2>/dev/null)" ]; then
            echo "⚠️ 未找到匹配的 .run 包, 跳过植入 (固件照常构建)"
            rmdir files/root/run 2>/dev/null || true
          else
            cat > files/root/run/说明.txt << 'EOF'
          插件 .run 离线安装包 (与本次固件同期构建, fw4 + x86_64)

          用法 (在路由器 SSH 里执行):
            sh /root/run/xxx.run --check    # 先校验完整性（只验不装）
            chmod +x /root/run/xxx.run && /root/run/xxx.run

          说明:
            - 用于单独升级 / 重装某个代理插件, 无需重刷整个固件
            - 包内为第三方编译的 ipk (来源见 sirpdboy/buildrun), 与固件内预装插件版本可能不同, 以包内版本为准
            - kmod 类内核模块不随 .run 热更新（内核强绑定），只热更新纯用户态插件
          EOF
            echo "---- 已植入固件 /root/run ----"
            ls -lh files/root/run/
          fi
      # =========================================================================

      - name: 写入固件版本标记 (供在线升级比对)
        run: |
          mkdir -p files/etc
          echo "${{ steps.ver.outputs.version }}-$(date -u +%Y%m%d%H%M%S)" > files/etc/yyd-firmware-release
          echo "版本标记: $(cat files/etc/yyd-firmware-release)"
          # 兜底：确保升级脚本有执行权限（即使 git 没保留 exec bit）
          chmod +x files/usr/bin/fw-upgrade 2>/dev/null || true

      - name: 用官方 ImageBuilder 构建固件
        run: |
          case "${{ inputs.firmware_size }}" in
            1G) ROOTFS=1024 ;;
            2G) ROOTFS=2048 ;;
            3G) ROOTFS=3072 ;;
            4G) ROOTFS=4096 ;;
          esac
          echo "固件大小: ${{ inputs.firmware_size }} (${ROOTFS}MB)"
          docker run --rm \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build.sh:/home/build/immortalwrt/build.sh" \
            -e ROOTFS_SIZE=$ROOTFS \
            -e ENABLE_NIKKI=${{ inputs.enable_nikki }} \
            -e ENABLE_OPENCLASH=${{ inputs.enable_openclash }} \
            -e ENABLE_LUCKY=${{ inputs.enable_lucky }} \
            -e ENABLE_STORE=${{ inputs.enable_store }} \
            -e ENABLE_DOCKER=${{ inputs.enable_docker }} \
            -e ENABLE_PASSWALL=${{ inputs.enable_passwall }} \
            -e ENABLE_PASSWALL2=${{ inputs.enable_passwall2 }} \
            -e ENABLE_QUICKFILE=${{ inputs.enable_quickfile }} \
            -e ENABLE_TGCHECKIN=${{ inputs.enable_tgcheckin }} \
            -e EXTRA_PACKAGES="${{ inputs.extra_packages }}" \
            immortalwrt/imagebuilder:x86-64-openwrt-${{ steps.ver.outputs.version }} \
            /bin/bash /home/build/immortalwrt/build.sh

      - name: 生成版本与校验文件 (供在线升级)
        run: |
          cd ${{ github.workspace }}/bin/targets/x86/64
          cp ${{ github.workspace }}/files/etc/yyd-firmware-release version.txt
          sha256sum *squashfs-combined*.img.gz > SHA256SUMS.txt
          echo "---- version.txt / SHA256SUMS.txt ----"
          cat version.txt SHA256SUMS.txt

      - name: 生成固件信息
        run: |
          cat > router-info.md << EOF
          ## 📡 固件信息
          - 版本: ImmortalWrt ${{ steps.ver.outputs.version }} (x86-64, UEFI)
          - 固件大小: ${{ inputs.firmware_size }}
          - 🏠 后台地址: http://${{ inputs.lan_ip }} (用户名 root, 首次无密码)
          - 插件: Nikki=${{ inputs.enable_nikki }} / OpenClash=${{ inputs.enable_openclash }} / PassWall=${{ inputs.enable_passwall }} / PassWall2=${{ inputs.enable_passwall2 }} / Lucky=${{ inputs.enable_lucky }} / 商店=${{ inputs.enable_store }} / Docker=${{ inputs.enable_docker }} / QuickFile=${{ inputs.enable_quickfile }} / TG打卡依赖=${{ inputs.enable_tgcheckin }}

          ## ⬆️ 一键升级
          旧固件升级: LuCI → 系统 → 备份/升级 → 上传本固件 → 勾选"保留配置" → 升级, 配置不丢失。
          EOF
          cat router-info.md

      - name: 清理 Release 中的旧固件 (efi/bios 双镜像，只保留最新，避免在线升级选错版本)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for a in $(gh release view x86-64-autobuild --json assets -q '.assets[].name' 2>/dev/null | grep -F 'squashfs-combined' || true); do
            echo "删除旧固件: $a"
            gh release delete-asset x86-64-autobuild "$a" -y || true
          done
          echo "清理完成"

      - name: 发布到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: x86-64-autobuild
          name: "x86-64 自动构建"
          body_path: router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined*.img.gz
            ${{ github.workspace }}/bin/targets/x86/64/SHA256SUMS.txt
            ${{ github.workspace }}/bin/targets/x86/64/version.txt
            ${{ github.workspace }}/pkgrun/*-fw4-ipk-x86_64-*.run

      - name: 记录已构建版本 (供自动检查用)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "${{ steps.ver.outputs.version }}" > .last-built-version
          git add .last-built-version
          git diff --cached --quiet || (git commit -m "记录已构建版本: ${{ steps.ver.outputs.version }}" && git push)
